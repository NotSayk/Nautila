[package]
name = "nautila"
version = "0.2.5"
description = "Notes hors connexion pour les étudiants"
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
name = "nautila_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Même version de sqlx que le greffon SQL : sert à la commande `db_transaction` (transaction sur son pool).
sqlx = { version = "0.8", default-features = false, features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Mise à jour intégrée, relance et ouverture de la page des versions : bureau seulement (pas de mobile).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
