# Construit les installateurs de bureau (Windows, macOS, Linux) et les joint à une version GitHub.
# Se lance en poussant une étiquette « v… » ou à la main depuis l'onglet Actions.
name: Publier les applications de bureau

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Nautila v__VERSION__
          releaseBody: |
            Applications de bureau de Nautila.

            - **Windows** : `Nautila_…_x64-setup.exe` (ou le `.msi`)
            - **macOS** : `Nautila_…_universal.dmg` (Intel et Apple Silicon)
            - **Linux** : `.AppImage`, `.deb` ou `.rpm`

            Les installateurs ne sont pas signés : Windows affiche « Informations complémentaires → Exécuter quand même »,
            et sur macOS il faut un clic droit sur l'application puis « Ouvrir » la première fois.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
