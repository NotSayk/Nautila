# Construit les installateurs de bureau (Windows, macOS, Linux) et les joint à une version GitHub.
# Se lance en poussant une étiquette « v… » ou à la main depuis l'onglet Actions.
name: Publier les applications de bureau

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      # Sans clé de signature, les installateurs seraient construits mais aucune mise à jour ne serait publiée.
      - name: Vérifier la clé de signature des mises à jour
        shell: bash
        # Seule la présence de la clé est transmise ici, jamais la clé elle-même.
        env:
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_SIGNING_KEY" != "true" ]; then
            echo "::error title=Clé de signature manquante::Le secret GitHub TAURI_SIGNING_PRIVATE_KEY est vide ou absent. Ajoute-le dans Settings > Secrets and variables > Actions (contenu du fichier de clé privée générée par « tauri signer generate »), puis relance le workflow."
            exit 1
          fi

      # Actions tierces épinglées par empreinte de commit (version en commentaire) : une étiquette peut être déplacée.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Le jeton GitHub n'est pas laissé dans .git/config pour les étapes suivantes.
          persist-credentials: false

      # L'étiquette « v… » doit correspondre à la version de package.json, tauri.conf.json et Cargo.toml.
      - name: Vérifier la version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            node scripts/version.mjs check "$GITHUB_REF_NAME"
          else
            node scripts/version.mjs check
          fi

      - name: Dépendances système (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # branche stable
        with:
          toolchain: stable
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signature des mises à jour, donnée à cette seule étape (la clé n'a pas de mot de passe : le second
          # secret peut rester absent).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Nautila v__VERSION__
          releaseBody: |
            Applications de bureau de Nautila.

            - **Windows** : `Nautila_…_x64-setup.exe` (ou le `.msi`)
            - **macOS** : `Nautila_…_universal.dmg` (Intel et Apple Silicon)
            - **Linux** : `.AppImage`, `.deb` ou `.rpm`

            Les installateurs ne sont pas signés : Windows affiche « Informations complémentaires → Exécuter quand même »,
            et sur macOS il faut un clic droit sur l'application puis « Ouvrir » la première fois.

            Une fois installée, l'application de bureau se met à jour toute seule (Windows, macOS et Linux AppImage) : les
            mises à jour sont vérifiées par une signature propre à Nautila, mais les installateurs restent non signés au
            sens de Windows et de macOS. Avec un `.deb` ou un `.rpm`, télécharge la nouvelle version ici.
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
